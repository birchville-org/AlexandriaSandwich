name: alexandria

services:
  ui:
    image: alexandria-ui:latest
    container_name: alexandria_ui
    mem_limit: 256m
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://alex.local:5678/webhook/alexandria/ocr}
      - FALLBACK_N8N_URL=${FALLBACK_N8N_URL:-http://alex.local:5678/webhook/alexandria/ocr}
      - PUBLIC_URL=https://alex.birchville.org
      - AUTH_LOGIN_URL=https://auth.birchville.org/?rd=https://alex.birchville.org/
      - SHOW_PROJECT_LINKS=true
      - INGRESS_LABEL=Traefik v3 + Authelia 2FA (alex.birchville.org)
    volumes:
      - ./data/input:/data/input
      - ./data/processing:/data/processing
      - ./data/output:/data/output
      - ./ui:/app
      - ./scripts:/app/scripts
    extra_hosts:
      - "alex.local:${ALEX_LOCAL_IP:-127.0.0.1}"
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"

      # 1. Öffentliche Endpunkte (Healthcheck & Statische Assets)
      # Priority 200 (für Monitoring und Uptime-Prüfungen)
      - "traefik.http.routers.alex-public.rule=(Host(`alex.birchville.org`) || Host(`alex.birchville.cc`)) && (PathPrefix(`/health`) || PathPrefix(`/static`))"
      - "traefik.http.routers.alex-public.entrypoints=web"
      - "traefik.http.routers.alex-public.priority=200"
      - "traefik.http.routers.alex-public.service=alex-service"

      # 2. Geschütztes Portal (Gesamtes Alexandria-Portal inkl. TOC Studio, Upload, Dashboard, Jobs)
      # Priority 100 mit Authelia Forward-Auth (2FA SSO)
      - "traefik.http.routers.alex-portal.rule=Host(`alex.birchville.org`) || Host(`alex.birchville.cc`)"
      - "traefik.http.routers.alex-portal.entrypoints=web"
      - "traefik.http.routers.alex-portal.priority=100"
      - "traefik.http.routers.alex-portal.middlewares=authelia@docker"
      - "traefik.http.routers.alex-portal.service=alex-service"

      # Service Definition
      - "traefik.http.services.alex-service.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  proxy-net:
    external: true
