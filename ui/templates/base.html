<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AlexandriaSandwich{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .navbar { background: #2c3e50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .navbar .brand { color: #ecf0f1; text-decoration: none; font-size: 1.2rem; font-weight: 700; }
    .navbar .brand:hover { color: #3498db; }
    .nav-links a { color: #bdc3c7; text-decoration: none; margin-left: 1.5rem; }
    .nav-links a:hover { color: #fff; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .footer { text-align: center; padding: 2rem; color: #999; }
    .footer a { color: #3498db; text-decoration: none; }
    h1 { margin-bottom: 1.5rem; color: #2c3e50; }
    h2 { margin: 1.5rem 0 1rem; color: #2c3e50; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; font-weight: 600; color: #495057; }
    tr:hover { background: #f8f9fa; }
    .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .badge-pass { background: #d4edda; color: #155724; }
    .badge-fail { background: #f8d7da; color: #721c24; }
    .badge-neutral { background: #e2e3e5; color: #383d41; }
    .btn { display: inline-block; padding: 0.6rem 1.5rem; background: #3498db; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; text-decoration: none; }
    .btn:hover { background: #2980b9; }
    .btn-secondary { background: #95a5a6; }
    .btn-secondary:hover { background: #7f8c8d; }
    .drop-zone { border: 3px dashed #bdc3c7; border-radius: 8px; padding: 3rem; text-align: center; color: #7f8c8d; margin-bottom: 1rem; cursor: pointer; transition: border-color 0.2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #3498db; color: #3498db; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-group input { width: auto; }
    .file-list { margin-top: 1rem; }
    .file-list li { padding: 0.5rem; background: #f8f9fa; border-radius: 4px; margin-bottom: 0.5rem; list-style: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .stat { text-align: center; }
    .stat .num { font-size: 2rem; font-weight: 700; color: #2c3e50; }
    .stat .label { color: #7f8c8d; font-size: 0.9rem; }
    .alert { padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    pre { background: #f8f9fa; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
    .text-muted { color: #7f8c8d; }
    .img-preview { max-width: 300px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 0.5rem 0; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .pill { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 10px; font-size: 0.75rem; background: #e8e8e8; color: #555; }
    .section { margin-bottom: 2rem; }
    details summary { cursor: pointer; padding: 0.5rem 0; font-weight: 600; color: #2c3e50; }
    details { margin-bottom: 0.5rem; }
    .icon { font-size: 1.2rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">📚 AlexandriaSandwich</a>
    <div class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/upload">Upload</a>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <small>AlexandriaSandwich OCR Pipeline &middot; <a href="/health">Health</a></small>
  </footer>
</body>
</html>
