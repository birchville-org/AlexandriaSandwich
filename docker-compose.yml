services:
  ocr_worker:
    build:
      context: ./docker/worker
    image: alexandria-worker:latest
    container_name: alexandria_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OCR_LANG=${OCR_LANG:-deu+eng}
      - OCR_CONFIDENCE_THRESHOLD=${OCR_CONFIDENCE_THRESHOLD:-85}
    volumes:
      - ${DATA_DIR:-./data}/input:/data/input
      - ${DATA_DIR:-./data}/processing:/data/processing
      - ${DATA_DIR:-./data}/output:/data/output
      - ./scripts:/opt/alexandria/scripts:ro
      - ./templates:/opt/alexandria/templates:ro
      - ./examples:/opt/alexandria/examples:ro
    networks:
      - alexandria_default

  ui:
    profiles: ["ui", "all"]
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: alexandria-ui:latest
    container_name: alexandria_ui
    restart: unless-stopped
    ports:
      - "${PORT_UI:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - DATA_DIR=/data
      - N8N_WEBHOOK_URL=http://alexandria_n8n:5678/webhook/alexandria/ocr
    volumes:
      - ${DATA_DIR:-./data}/input:/data/input
      - ${DATA_DIR:-./data}/processing:/data/processing
      - ${DATA_DIR:-./data}/output:/data/output
      - ./scripts:/opt/alexandria/scripts:ro
    networks:
      - alexandria_default

  n8n:
    profiles: ["n8n", "all"]
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: alexandria_n8n
    restart: unless-stopped
    ports:
      - "${PORT_N8N:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:${PORT_N8N:-5678}/
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_SECURE_COOKIE=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODES_EXCLUDE=[]
    volumes:
      - ./n8n-data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/opt/alexandria/scripts:ro
      - ./workflows:/opt/alexandria/workflows:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    user: root
    networks:
      - alexandria_default

networks:
  alexandria_default:
    name: alexandria_default
